<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div id="status">Player X's Turn</div>
    <div id="scores">X: 0 | O: 0</div>
    <div style="margin: 10px 0;">
        <label>Player 1: <input type="text" id="player1Name" value="Player X" maxlength="20"></label>
        <label style="margin-left: 20px;">Player 2: <input type="text" id="player2Name" value="Player O" maxlength="20"></label>
    </div>
    <label>Best of: 
        <select id="winsNeeded">
            <option value="1">1</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
            <option value="7">7</option>
        </select>
    </label>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div style="display: flex; gap: 10px; justify-content: center; margin: 10px 0;">
        <button onclick="resetGame()">New Game</button>
        <button onclick="resetMatch()">New Match</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
